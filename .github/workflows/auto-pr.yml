# A teammate's branch gets its pull request opened for them, and merged for
# them when the change is safe.
#
# WHY. Claude Code web sessions can only push to their own branch. Getting
# that work live used to need a person to open the PR and merge it. Now:
# push → CI runs on the branch → this workflow opens the PR into main → if
# CI is green and the change touches nothing guarded, it merges itself.
#
# GUARDED means a human reads it first: database migrations (they have to
# be applied to production before the merge), dependency changes, this
# folder, and the stage model / gate / handoff code the operating model
# rests on. Those PRs get the `needs-review` label and a comment naming
# the files; the merge is one click for whoever reviews.
#
# It runs off the CI workflow's completion on purpose: a PR opened by
# GITHUB_TOKEN gets no `pull_request` checks of its own, so the push-run is
# the one that counts. main and the owner's claude/ branches are skipped.
name: Auto PR

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-pr:
    name: Open, label, or merge the branch's PR
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch != 'main' &&
      !startsWith(github.event.workflow_run.head_branch, 'claude/') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      CI_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch the branch
        run: git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"

      - name: Open the pull request if there is none
        id: pr
        run: |
          set -euo pipefail
          existing=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            title=$(git log -1 --format=%s "origin/$BRANCH")
            body=$(printf 'Opened automatically from `%s`.\n\n%s\n' "$BRANCH" "$(git log --format='- %s' "origin/main..origin/$BRANCH")")
            existing=$(gh pr create --base main --head "$BRANCH" --title "$title" --body "$body" | grep -oE '[0-9]+$')
            echo "Opened #$existing"
          else
            echo "PR #$existing already open"
          fi
          echo "number=$existing" >> "$GITHUB_OUTPUT"

      - name: Classify the change
        id: classify
        run: |
          set -euo pipefail
          files=$(git diff --name-only "origin/main...origin/$BRANCH")
          guarded=$(printf '%s\n' "$files" | grep -E \
            '^(supabase/|\.github/|package\.json$|package-lock\.json$|src/lib/presale-stages\.ts$|src/lib/stage-flow\.ts$|src/lib/pipeline-stages\.ts$|src/lib/won-gate\.ts$|src/lib/sales-handoff\.ts$|src/lib/server/)' \
            || true)
          if [ -n "$guarded" ]; then
            echo "guarded=true" >> "$GITHUB_OUTPUT"
            { echo 'files<<EOF'; echo "$guarded"; echo 'EOF'; } >> "$GITHUB_OUTPUT"
            echo "Guarded by:"; echo "$guarded"
          else
            echo "guarded=false" >> "$GITHUB_OUTPUT"
            echo "Safe: no guarded paths touched"
          fi

      - name: CI failed — say so once
        if: env.CI_CONCLUSION != 'success'
        run: |
          set -euo pipefail
          n="${{ steps.pr.outputs.number }}"
          gh pr edit "$n" --add-label ci-failed 2>/dev/null || {
            gh label create ci-failed --color B60205 --description "CI is red on the latest push" >/dev/null 2>&1 || true
            gh pr edit "$n" --add-label ci-failed
          }
          marker="<!-- auto-pr:ci-failed:$HEAD_SHA -->"
          if ! gh pr view "$n" --json comments --jq '.comments[].body' | grep -qF "$marker"; then
            gh pr comment "$n" --body "$(printf '%s\nCI failed on `%s`: %s\n\nFix it in your session and push again; this PR updates itself.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_' "$marker" "${HEAD_SHA:0:7}" "$CI_URL")"
          fi

      - name: Guarded — ask for a human
        if: env.CI_CONCLUSION == 'success' && steps.classify.outputs.guarded == 'true'
        run: |
          set -euo pipefail
          n="${{ steps.pr.outputs.number }}"
          gh pr edit "$n" --remove-label ci-failed >/dev/null 2>&1 || true
          gh pr edit "$n" --add-label needs-review 2>/dev/null || {
            gh label create needs-review --color FBCA04 --description "Touches migrations, dependencies or the stage model — a person merges" >/dev/null 2>&1 || true
            gh pr edit "$n" --add-label needs-review
          }
          marker="<!-- auto-pr:needs-review -->"
          if ! gh pr view "$n" --json comments --jq '.comments[].body' | grep -qF "$marker"; then
            files=$(printf '%s\n' "${{ steps.classify.outputs.files }}" | sed 's/^/- `/; s/$/`/')
            gh pr comment "$n" --body "$(printf '%s\nCI is green, but this change touches files a person reviews before merging:\n\n%s\n\nIf it adds a migration under `supabase/`, apply it to the production database first, then merge.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_' "$marker" "$files")"
          fi

      - name: Safe and green — merge
        if: env.CI_CONCLUSION == 'success' && steps.classify.outputs.guarded == 'false'
        run: |
          set -euo pipefail
          n="${{ steps.pr.outputs.number }}"
          gh pr edit "$n" --remove-label ci-failed >/dev/null 2>&1 || true
          gh pr merge "$n" --squash --delete-branch --match-head-commit "$HEAD_SHA"
          echo "Merged #$n at ${HEAD_SHA:0:7}"
